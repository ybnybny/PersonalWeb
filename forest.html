<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>森林 · 赛博串门</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/layout-base@2.0.0/layout-base.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/cose-base@2.2.0/cose-base.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/cytoscape-fcose@2.2.0/cytoscape-fcose.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
</head>
<body>
  <div class="content-page">
    <div class="content-head">
      <span class="back-door" id="back-door">🚪 门·主房间 <button class="door-btn">开门</button></span>
      <span style="color:var(--muted)">森林</span>
    </div>
    <div class="content-intro">这是森林。摸不到。但走进去，会碰到很多念头。</div>

    <div class="forest-wrap">
      <div id="forest-cy"></div>
    </div>

    <!-- 节点详情弹窗 -->
    <div class="panel-overlay hidden" id="node-panel">
      <div class="panel">
        <button class="panel-close" data-close="node-panel">×</button>
        <h2 id="node-label"></h2>
        <div id="node-tags" style="margin-bottom:8px;"></div>
        <div id="node-desc" class="markdown-body"></div>
        <div id="node-link" style="margin-top:12px;"></div>
      </div>
    </div>
  </div>

  <script type="module" src="js/forest.js"></script>
</body>
</html>
